<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Consultant Management System</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; }
    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .ok { background: #e6f4e6; padding: 10px; }
    .error { background: #fde4e4; padding: 10px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  {% if user %}
    <p>
      {% if user.role == "planner" %}<a href="/">Assign tasks</a> | <a href="/consultants">Consultants</a> |{% endif %}
      Logged in as <b>{{ user.username }}</b> ({{ user.role }}) | <a href="/logout">Log out</a>
    </p>
  {% endif %}

  {% if message %}
    <p class="{{ 'ok' if ok else 'error' }}">{{ message }}</p>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
